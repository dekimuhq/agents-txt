name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - run: npm run check:no-private-dep
      - run: npm run build
      - run: npm run gen:schema
      - run: npm test
