name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - run: npm run check:no-private-dep
      - run: npm run build
      - name: bin entry must start with a shebang (0.1.0 shipped without one — npx ran it with sh; 0.1.1's silent-exit through the .bin symlink is covered by the packed-install test in src/cli.test.ts under npm test)
        run: head -c 21 dist/cli.js | grep -q '^#!/usr/bin/env node' || { echo '::error::dist/cli.js has no shebang'; exit 1; }
      - run: npm run gen:schema
      - run: npm test
